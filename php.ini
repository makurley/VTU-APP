allow_url_fopen = Off
display_errors = Off
enable_dl = Off
file_uploads = On
max_execution_time = 24000
max_input_time = 2400
max_input_vars = 5000
memory_limit = 134217728134217728M
post_max_size = 250M
session.gc_maxlifetime = 1440
session.save_path = "/var/cpanel/php/sessions/alt-php80"
upload_max_filesize = 50M
zlib.output_compression = Off
